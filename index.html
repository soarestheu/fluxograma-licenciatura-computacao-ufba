<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluxograma - Licenciatura em Computação UFBA</title>
<style>
:root{--bg:#f2f0eb;--card:#fff;--text:#1b2430;--muted:#677082;--border:#dedad2;--blue:#27487a;--green:#1c8a52}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}.wrap{max-width:1560px;margin:auto;padding:20px 16px}h1{font-size:clamp(28px,5vw,46px);margin:0;line-height:1.05}p{color:var(--muted)}.tools{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:2;display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--text)}input{flex:1;min-width:220px}button{cursor:pointer}.board{display:grid;grid-template-columns:repeat(9,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:24px}.col{background:#ffffff88;border-radius:14px;padding:8px}.col h2{font-size:15px;margin:2px 4px 10px}.card{width:100%;text-align:left;margin-bottom:8px;border-left:6px solid var(--accent);transition:.15s}.card:hover{transform:translateY(-1px)}.card b,.card small,.card em{display:block}.card b{font-size:13px}.card small{margin:3px 0}.card em{font-size:11px;color:var(--muted);font-style:normal}.done{background:#e3f4ea}.hidden{display:none}.legend{color:var(--muted);font-size:12px;margin:4px 0 16px}.summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:14px 0}.progress{height:8px;background:var(--border);border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);width:0}
</style></head>
<body><main class="wrap"><h1>Licenciatura em Computação</h1><p>Fluxograma UFBA, válido a partir de 2023.1. Clique numa disciplina para marcar como paga ou pendente.</p><div class="summary"><b id="count">0 disciplinas pagas</b><div class="progress"><i id="bar"></i></div></div><div class="tools"><input id="search" type="search" placeholder="Buscar por nome ou código"><button id="clear">Apagar progresso</button></div><div class="legend">Computação · Matemática · Educação · Estágio · Optativa</div><section id="board" class="board"></section></main>
<script>
const courses=[
['EDCB80','Filosofia da Educação',60,1,'#4a9ad6'],['MATA37','Introdução à Lógica de Programação',60,1,'#e8806c'],['MATA39','Seminários de Introdução ao Curso',45,1,'#e8806c'],['MATA01','Geometria Analítica',60,1,'#4fa66a'],['MATA42','Matemática Discreta I',60,1,'#4fa66a'],
['EDC287','Educação e Tecnologias Contemporâneas',60,2,'#4a9ad6'],['MATD04','Estruturas de Dados',60,2,'#e8806c','MATA37'],['MATC81','Sistemas Básicos de Computação',60,2,'#e8806c'],['MATC73','Introdução à Lógica Matemática',60,2,'#e8806c','MATA01'],['MATA68','Computador, Ética e Sociedade',45,2,'#e8806c'],
['EDCA01','Fundamentos Psicológicos da Educação',60,3,'#4a9ad6'],['MATA55','Programação Orientada a Objetos',60,3,'#e8806c','MATD04'],['MAT236','Métodos Estatísticos',60,3,'#4fa66a'],['MATC94','Linguagens Formais e Teoria da Computação',60,3,'#e8806c'],['OPT001','Optativa',60,3,'#f0a020'],
['EDCA11','Didática e Práxis Pedagógica I',60,4,'#4a9ad6'],['MATA62','Engenharia de Software I',60,4,'#e8806c'],['MATC82','Sistemas Web',60,4,'#e8806c','MATA55'],['MATA59','Rede de Computadores I',60,4,'#e8806c','MATC81'],['MATA41','Informática na Educação',60,4,'#e8806c'],['LETE46','Libras - Língua Brasileira de Sinais',30,4,'#4a9ad6'],
['EDCA12','Didática e Práxis Pedagógica II',60,5,'#4a9ad6','EDCA11'],['MATD05','Banco de Dados e Aplicações',60,5,'#e8806c','MATD04'],['MATB19','Sistemas Multimídia',60,5,'#e8806c','MATA55'],['MATB21','Ambientes Interativos de Aprendizagem',60,5,'#e8806c'],['EDC286','Avaliação da Aprendizagem',60,5,'#4a9ad6'],
['MATC68','Estágio Supervisionado I',90,6,'#d93a3a','EDCA12'],['MATC76','Prática de Ensino de Computação I',60,6,'#e8806c'],['MATC72','Interação Humano-Computador',60,6,'#e8806c'],['MATC78','Projeto de Software Educativo',60,6,'#e8806c'],['MATB22','Laboratório de Informática na Educação',45,6,'#e8806c'],
['MATC69','Estágio Supervisionado II',90,7,'#d93a3a','MATC68'],['MATC77','Prática de Ensino de Educação II',60,7,'#e8806c','MATC76'],['MATC79','Projetos Interdisciplinares',60,7,'#e8806c'],['MATB20','Inteligência Artificial em Educação',60,7,'#e8806c'],['OPT002','Optativa',60,7,'#f0a020'],
['MATC70','Estágio Supervisionado III',90,8,'#d93a3a','MATC69'],['OPT003','Optativa',60,8,'#f0a020'],['OPT004','Optativa',60,8,'#f0a020'],['OPT005','Optativa',60,8,'#f0a020'],
['MATC71','Estágio Supervisionado IV',90,9,'#d93a3a','MATC70'],['OPT006','Optativa',60,9,'#f0a020'],['OPT007','Optativa',60,9,'#f0a020'],['OPT008','Optativa',60,9,'#f0a020']].map(x=>({code:x[0],name:x[1],h:x[2],sem:x[3],color:x[4],pre:x[5]}));
let done=JSON.parse(localStorage.getItem('ufba-done')||'{}');const board=document.querySelector('#board');
function render(){const q=document.querySelector('#search').value.toLowerCase();board.innerHTML='';for(let s=1;s<=9;s++){const col=document.createElement('div');col.className='col';col.innerHTML=`<h2>${s}º semestre</h2>`;courses.filter(c=>c.sem===s).forEach(c=>{const b=document.createElement('button');b.className='card '+(done[c.code]?'done':'')+(q&&!(c.code+' '+c.name).toLowerCase().includes(q)?' hidden':'');b.style.setProperty('--accent',c.color);b.innerHTML=`<b>${c.code}</b><small>${c.name}</small><em>${c.h} h${c.pre?' · pré-requisito: '+c.pre:''}${done[c.code]?' · ✓ paga':''}</em>`;b.onclick=()=>{done[c.code]=!done[c.code];localStorage.setItem('ufba-done',JSON.stringify(done));render()};col.appendChild(b)});board.appendChild(col)}const n=Object.values(done).filter(Boolean).length;document.querySelector('#count').textContent=`${n} de ${courses.length} disciplinas pagas`;document.querySelector('#bar').style.width=(n/courses.length*100)+'%'}
document.querySelector('#search').oninput=render;document.querySelector('#clear').onclick=()=>{done={};localStorage.removeItem('ufba-done');render()};render();
</script></body></html>
